name: CI

on:
    push:
    pull_request:

jobs:
    check:
        name: Style, analyse statique et tests
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            # Même version de PHP que l'hébergement de production.
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.4'
                  coverage: none

            - uses: actions/cache@v6
              with:
                  path: ~/.composer/cache
                  key: composer-${{ hashFiles('composer.lock') }}

            - run: composer install --no-interaction --no-progress

            # Aucun appel réseau : les tests remplacent le site crawlé par de fausses réponses.
            - run: composer check

    docker:
        name: Image Docker
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7

            - run: docker build -t semspider .

            # L'image doit démarrer et servir la page d'accueil.
            - run: |
                  docker run -d --name semspider -p 8000:8000 semspider
                  for i in $(seq 1 20); do
                      curl -fsS http://localhost:8000/fr > /dev/null && exit 0
                      sleep 1
                  done
                  docker logs semspider
                  exit 1

    deploy:
        name: Mise en production
        needs: [check, docker]
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        runs-on: ubuntu-latest

        steps:
            # La clé ne peut lancer que le déploiement : le serveur impose la commande (authorized_keys).
            # Le script doit annoncer ce dépôt : la clé d'un autre projet déploierait le mauvais site.
            # shell: bash active pipefail, un échec du déploiement fait aussi échouer le job.
            - shell: bash
              env:
                  SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
                  KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
                  HOST: ${{ secrets.VPS_HOST }}
                  PROJECT: ${{ github.event.repository.name }}
              run: |
                  install -m 700 -d ~/.ssh
                  printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
                  ssh -T "deploy@$HOST" | tee deploy.log
                  grep -qF "DÉPLOIEMENT TERMINÉ : $PROJECT" deploy.log
