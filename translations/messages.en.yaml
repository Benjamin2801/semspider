meta:
    title: "SemSpider — the technical and SEO audit of your website"
    description: "Crawl your website: weight, TTFB, load time, share of images, CSS and JS, title, meta description, H1, H2 and H3 of every page."

nav:
    language: "Language"
    theme: "Switch between light and dark theme"

home:
    title: "Every page of your website, [put under the microscope]."
    lead: "Weight, response time, resources and SEO tags: up to %max% pages analysed, nothing to install, no account."
    measures:
        title: "What is measured"
        performance:
            title: "Performance"
            text: "Transferred weight, TTFB, estimated load time, number of requests, share of images, HTML, CSS, JS and the rest."
        seo:
            title: "SEO tags"
            text: "Title, meta description, H1, H2 and H3 of every page with their length; canonical, noindex, language, structured data."
        site:
            title: "Site structure"
            text: "Click depth, inbound links, broken links, duplicate titles and content, orphan pages from the sitemap."
    note: "SemSpider follows robots.txt and does not run the pages' JavaScript: the load time shown is an estimate, from the HTML then the resources downloaded in parallel."

form:
    url_label: "Website address"
    url_placeholder: "www.example.com"
    submit: "Crawl"

