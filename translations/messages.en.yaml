help:
    http_error:
        why: "The page does not load: visitors and search engines hit an error."
        fix: "Restore the page, or 301-redirect it to the closest page and fix the links pointing to it."
    redirect:
        why: "Information: this address redirects. Only the links still pointing to it are a problem (see “Links to redirects”)."
        fix: "Keep the redirect for external links and point internal links to the final address."
    blocked:
        why: "Information: robots.txt forbids crawling this address, so it is analysed neither here nor by search engines."
        fix: "Nothing to do if intended (admin, internal search); otherwise remove the Disallow rule."
    noindex:
        why: "Information: the page is excluded from search results, often on purpose (legal notice, cart, internal search). Its tags and content are therefore not checked."
        fix: "Nothing to do if intended; otherwise remove noindex from the meta robots tag or the X-Robots-Tag header."
    canonical_elsewhere:
        why: "Information: the page names another address as the version to index (duplicate, parameters, pagination). Its tags and content are therefore not checked."
        fix: "Nothing to do if intended; otherwise point the canonical to the page itself."
    title_missing:
        why: "The title is the heading shown in search results; without it, Google makes one up."
        fix: "Write a unique title of 30 to 60 characters, main topic first."
    title_short:
        why: "A very short title describes the page poorly and wastes available space."
        fix: "Extend it to 30 to 60 characters: topic, detail, possibly the brand."
    title_long:
        why: "Beyond about 60 characters, Google truncates the title in its results."
        fix: "Trim it to 60 characters, keeping the important words first."
    meta_missing:
        why: "Without a meta description, Google writes its own snippet, often less compelling."
        fix: "Write 70 to 160 characters that sum up the page and invite the click."
    meta_short:
        why: "A very short description is often replaced by Google."
        fix: "Extend it to 70 to 160 characters."
    meta_long:
        why: "Beyond about 160 characters, the snippet is truncated."
        fix: "Tighten it to 160 characters, essentials first."
    h1_missing:
        why: "The H1 states the page topic to visitors and search engines alike."
        fix: "Add a single H1 that carries the main topic."
    h1_multiple:
        why: "Several H1s blur the page's main topic."
        fix: "Keep one H1 and turn the others into H2s."
    heading_skip:
        why: "A skipped level (an H3 right after the H1) breaks the hierarchy read by search engines and screen readers."
        fix: "Follow the H1, H2, H3 order without skipping a level."
    thin_content:
        why: "Under 300 words rarely covers a topic: the page may be judged thin."
        fix: "Expand the content, merge the page with a close one, or set it to noindex if it is a utility page."
    lang_missing:
        why: "Without a lang attribute, search engines and screen readers must guess the language."
        fix: "Add lang=\"en\" (or the page language) to the html tag."
    viewport_missing:
        why: "Without a meta viewport, the page shows on mobile as a shrunk desktop version."
        fix: "Add <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"> to the head."
    image_alt_missing:
        why: "Alternative text describes the image to search engines and screen readers."
        fix: "Add a descriptive alt, or alt=\"\" for a purely decorative image."
    image_heavy:
        why: "Heavy images are the first cause of slow pages."
        fix: "Resize them to their display size and compress them, ideally as WebP or AVIF."
    image_dimensions:
        why: "Without width and height, the page shifts while loading (CLS)."
        fix: "Set width and height on every image, or reserve their space in CSS with aspect-ratio."
    heavy_page:
        why: "A heavy page loads slowly, especially on mobile."
        fix: "Start with the largest items of the Performance detail: images, fonts, scripts."
    slow_ttfb:
        why: "The server takes too long to answer: everything else waits."
        fix: "Enable page caching (server or CDN), lighten database queries, check the hosting."
    slow_load:
        why: "Beyond 3 s, a growing share of mobile visitors leaves."
        fix: "Cut resource weight and TTFB; the Performance detail shows what to work on."
    many_requests:
        why: "Each request adds waiting time, especially on mobile."
        fix: "Bundle CSS and JS, remove unused scripts, inline icons as SVG."
    no_compression:
        why: "Uncompressed HTML weighs 3 to 5 times more."
        fix: "Enable gzip or brotli on the server (mod_deflate, hosting settings)."
    broken_resources:
        why: "Images, styles or scripts are missing: the page may render badly."
        fix: "Fix or remove the failing addresses listed in the detail."
    mixed_content:
        why: "Browsers block http resources on an https page."
        fix: "Switch these addresses to https."
    incomplete:
        why: "Some resources did not answer in time: weight and load time are underestimated."
        fix: "Run the crawl again; if it persists, check these resources, probably very slow."
    blocking_scripts:
        why: "A head script without defer or async blocks rendering while it downloads and runs."
        fix: "Add defer (or async for an independent script), or move the script to the end of the page."
    blocking_styles:
        why: "Each stylesheet in the head delays the first render."
        fix: "Bundle CSS into one or two files and defer those not needed for the first screen."
    legacy_images:
        why: "At equal quality, WebP and AVIF often weigh 25 to 50% less than JPEG or PNG."
        fix: "Convert these images to WebP or AVIF, with the picture tag to keep a fallback format."
    short_cache:
        why: "Without long caching, the browser downloads styles, scripts and images again on every visit."
        fix: "Serve static files with Cache-Control: max-age of at least a week, ideally a year with versioned names."
    lazy_first_image:
        why: "The first image is often the largest element on screen (LCP): lazy-loaded, it arrives late."
        fix: "Remove loading=\"lazy\" from images visible on load and keep it for those further down."
    duplicate_title:
        why: "Identical titles stop search engines from telling the pages apart."
        fix: "Make each title unique and specific to its page."
    duplicate_meta:
        why: "Identical descriptions help neither search engines nor users choose."
        fix: "Write a description specific to each page."
    duplicate_content:
        why: "Two pages with identical text compete; search engines keep only one."
        fix: "Merge the pages, redirect one to the other or add a canonical."
    broken_links:
        why: "Links to pages in error frustrate visitors and waste crawling."
        fix: "Fix the links listed in the detail, or redirect the missing pages."
    redirect_links:
        why: "A link to a redirect forces a detour on every click and every crawl."
        fix: "Replace these links with the final address shown in the detail."
    orphan:
        why: "No page of the site links here: search engines find it poorly and rate it as minor."
        fix: "Add links from related pages: menu, category, related articles."
    not_in_sitemap:
        why: "The sitemap helps search engines find and revisit important pages."
        fix: "Add the page to the sitemap, or check it really should be indexed."
    deep:
        why: "More than 3 clicks from the home page, a page is crawled less and gets fewer links."
        fix: "Bring it closer: links from the home page, categories or the most visited pages."

