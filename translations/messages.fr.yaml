meta:
    title: "SemSpider — l'audit technique et SEO de votre site"
    description: "Crawlez votre site : poids, TTFB, chargement, part des images, du CSS et du JS, title, meta description, H1, H2 et H3 de chaque page."

nav:
    language: "Langue"
    theme: "Basculer entre thème clair et sombre"

home:
    # Le mot entre crochets est surligné.
    title: "Chaque page de votre site, [passée au crible]."
    lead: "Poids, temps de réponse, ressources et balises SEO : jusqu'à %max% pages analysées, sans installation ni compte."
    measures:
        title: "Ce qui est mesuré"
        performance:
            title: "Performance"
            text: "Poids transféré, TTFB, chargement estimé, nombre de requêtes, part des images, du HTML, du CSS, du JS et du reste."
        seo:
            title: "Balises SEO"
            text: "Title, meta description, H1, H2 et H3 de chaque page avec leur longueur ; canonical, noindex, langue, données structurées."
        site:
            title: "Structure du site"
            text: "Profondeur de clic, liens entrants, liens cassés, titres et contenus en double, pages orphelines du sitemap."
    note: "SemSpider respecte robots.txt et n'exécute pas le JavaScript des pages : le chargement affiché est une estimation, à partir du HTML puis des ressources téléchargées en parallèle."

