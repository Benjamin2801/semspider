# Pour chaque problème : pourquoi il compte, puis comment le corriger (détail d'une page, synthèse).
help:
    http_error:
        why: "La page ne s'affiche pas : visiteurs et moteurs tombent sur une erreur."
        fix: "Rétablir la page, ou la rediriger en 301 vers la page la plus proche et corriger les liens qui y mènent."
    redirect:
        why: "Information : cette adresse redirige. Seuls les liens qui y mènent encore posent problème (voir « Liens vers des redirections »)."
        fix: "Garder la redirection pour les liens externes et pointer les liens internes vers l'adresse finale."
    blocked:
        why: "Information : robots.txt interdit l'exploration de cette adresse, qui n'est analysée ni ici ni par les moteurs."
        fix: "Rien à faire si c'est voulu (administration, recherche interne) ; sinon, retirer la règle Disallow."
    noindex:
        why: "Information : la page est exclue des résultats, souvent volontairement (mentions légales, panier, recherche interne). Ses balises et son contenu ne sont donc pas contrôlés."
        fix: "Rien à faire si c'est voulu ; sinon, retirer noindex de la balise meta robots ou de l'en-tête X-Robots-Tag."
    canonical_elsewhere:
        why: "Information : la page désigne une autre adresse comme version à indexer (doublon, paramètres, pagination). Ses balises et son contenu ne sont donc pas contrôlés."
        fix: "Rien à faire si c'est voulu ; sinon, faire pointer la canonical vers la page elle-même."
    title_missing:
        why: "Le title est le titre affiché dans les résultats de recherche ; sans lui, Google en invente un."
        fix: "Écrire un title unique de 30 à 60 caractères, avec le sujet principal au début."
    title_short:
        why: "Un title trop court décrit mal la page et laisse de la place inexploitée."
        fix: "Le compléter jusqu'à 30 à 60 caractères : sujet, précision, éventuellement la marque."
    title_long:
        why: "Au-delà d'environ 60 caractères, Google coupe le title dans ses résultats."
        fix: "Le ramener à 60 caractères en gardant les mots importants au début."
    meta_missing:
        why: "Sans meta description, Google compose lui-même un extrait, souvent moins engageant."
        fix: "Rédiger 70 à 160 caractères qui résument la page et donnent envie de cliquer."
    meta_short:
        why: "Une description très courte est souvent remplacée par Google."
        fix: "L'étoffer jusqu'à 70 à 160 caractères."
    meta_long:
        why: "Au-delà d'environ 160 caractères, l'extrait est coupé."
        fix: "La resserrer à 160 caractères, l'essentiel en premier."
    h1_missing:
        why: "Le H1 annonce le sujet de la page aux visiteurs comme aux moteurs."
        fix: "Ajouter un H1 unique qui reprend le sujet principal."
    h1_multiple:
        why: "Plusieurs H1 brouillent le sujet principal de la page."
        fix: "Garder un seul H1 et passer les autres en H2."
    heading_skip:
        why: "Un niveau sauté (un H3 juste après le H1) casse la hiérarchie lue par les moteurs et les lecteurs d'écran."
        fix: "Respecter l'ordre H1, H2, H3 sans sauter de niveau."
    thin_content:
        why: "Moins de 300 mots suffisent rarement à couvrir un sujet : la page peut être jugée mince."
        fix: "Enrichir le contenu, fusionner la page avec une page proche, ou la passer en noindex si elle est utilitaire."
    lang_missing:
        why: "Sans attribut lang, moteurs et lecteurs d'écran doivent deviner la langue."
        fix: "Ajouter lang=\"fr\" (ou la langue de la page) sur la balise html."
    viewport_missing:
        why: "Sans meta viewport, la page s'affiche sur mobile comme une version ordinateur réduite."
        fix: "Ajouter <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\"> dans le head."
    image_alt_missing:
        why: "Le texte alternatif décrit l'image aux moteurs et aux lecteurs d'écran."
        fix: "Ajouter un alt descriptif, ou alt=\"\" pour une image purement décorative."
    image_heavy:
        why: "Les images lourdes sont la première cause de pages lentes."
        fix: "Les redimensionner à leur taille d'affichage et les compresser, idéalement en WebP ou AVIF."
    image_dimensions:
        why: "Sans width et height, la page se décale pendant le chargement (CLS)."
        fix: "Indiquer width et height sur chaque image, ou réserver leur place en CSS avec aspect-ratio."
    heavy_page:
        why: "Une page lourde se charge lentement, surtout sur mobile."
        fix: "Commencer par les postes les plus gros du détail Performance : images, polices, scripts."
    slow_ttfb:
        why: "Le serveur met trop de temps à répondre : tout le reste attend."
        fix: "Activer un cache de page (serveur ou CDN), alléger les requêtes à la base, vérifier l'hébergement."
    slow_load:
        why: "Au-delà de 3 s, une part croissante des visiteurs mobiles abandonne."
        fix: "Réduire le poids des ressources et le TTFB ; le détail Performance montre les postes à traiter."
    many_requests:
        why: "Chaque requête ajoute de l'attente, surtout sur mobile."
        fix: "Regrouper les CSS et JS, retirer les scripts inutiles, passer les icônes en SVG dans la page."
    no_compression:
        why: "Un HTML non compressé pèse 3 à 5 fois plus lourd."
        fix: "Activer gzip ou brotli sur le serveur (mod_deflate, réglages de l'hébergeur)."
    broken_resources:
        why: "Des images, styles ou scripts manquent : la page peut s'afficher mal."
        fix: "Corriger ou retirer les adresses en erreur listées dans le détail."
    mixed_content:
        why: "Les navigateurs bloquent les ressources en http sur une page en https."
        fix: "Passer ces adresses en https."
    incomplete:
        why: "Certaines ressources n'ont pas répondu à temps : poids et chargement sont sous-estimés."
        fix: "Relancer le crawl ; si cela persiste, vérifier ces ressources, sans doute très lentes."
    blocking_scripts:
        why: "Un script du head sans defer ni async bloque l'affichage le temps d'être téléchargé et exécuté."
        fix: "Ajouter defer (ou async pour un script indépendant), ou déplacer le script en fin de page."
    blocking_styles:
        why: "Chaque feuille de style du head retarde le premier affichage."
        fix: "Regrouper les CSS en un ou deux fichiers et différer ceux qui ne servent pas au premier écran."
    legacy_images:
        why: "À qualité égale, WebP et AVIF pèsent souvent 25 à 50 % de moins que JPEG ou PNG."
        fix: "Convertir ces images en WebP ou AVIF, avec la balise picture pour garder un format de secours."
    short_cache:
        why: "Sans cache long, le navigateur retélécharge styles, scripts et images à chaque visite."
        fix: "Servir les fichiers statiques avec Cache-Control: max-age d'au moins une semaine, idéalement un an avec des noms versionnés."
    lazy_first_image:
        why: "La première image est souvent le plus grand élément de l'écran (LCP) : en lazy loading, elle arrive en retard."
        fix: "Retirer loading=\"lazy\" des images visibles au chargement et le garder pour celles plus bas."
    duplicate_title:
        why: "Des titles identiques empêchent les moteurs de distinguer les pages."
        fix: "Rendre chaque title unique et propre au contenu de sa page."
    duplicate_meta:
        why: "Des descriptions identiques n'aident ni les moteurs ni les internautes à choisir."
        fix: "Écrire une description propre à chaque page."
    duplicate_content:
        why: "Deux pages au texte identique se font concurrence ; les moteurs n'en gardent qu'une."
        fix: "Fusionner les pages, rediriger l'une vers l'autre ou ajouter une canonical."
    broken_links:
        why: "Les liens vers des pages en erreur gênent les visiteurs et gaspillent l'exploration."
        fix: "Corriger les liens listés dans le détail, ou rediriger les pages disparues."
    redirect_links:
        why: "Un lien vers une redirection impose un détour à chaque clic et à chaque exploration."
        fix: "Remplacer ces liens par l'adresse finale indiquée dans le détail."
    orphan:
        why: "Aucune page du site ne lie celle-ci : les moteurs la découvrent mal et la jugent peu importante."
        fix: "Ajouter des liens depuis les pages proches : menu, catégorie, articles liés."
    not_in_sitemap:
        why: "Le sitemap aide les moteurs à trouver et revisiter les pages importantes."
        fix: "Ajouter la page au sitemap, ou vérifier qu'elle doit vraiment être indexée."
    deep:
        why: "À plus de 3 clics de l'accueil, une page est moins explorée et reçoit moins de liens."
        fix: "La rapprocher : liens depuis l'accueil, les catégories ou les pages les plus vues."

